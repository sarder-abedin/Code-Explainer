name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,treesitter]' coverage
      # The browser test has its own job; skip it here.
      - run: coverage run --source=code_explainer -m pytest --ignore=tests/test_ui.py --ignore=tests/test_ui_ai.py --ignore=tests/test_ui_ai_explain.py --ignore=tests/test_ui_ai_static.py --ignore=tests/test_ui_health.py --ignore=tests/test_ui_chart.py --ignore=tests/test_ui_arch.py --ignore=tests/test_ui_theme.py --ignore=tests/test_ui_nav.py --ignore=tests/test_ui_contract.py --ignore=tests/test_ui_reader.py --ignore=tests/test_ui_guide.py
      - run: coverage report -m --fail-under=90

  no-treesitter:
    name: Tests without tree-sitter (regex fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]' coverage
      - run: python -c "import code_explainer.analysis.javascript_ts as t; assert not t.AVAILABLE"
      - run: coverage run --source=code_explainer -m pytest --ignore=tests/test_ui.py --ignore=tests/test_ui_ai.py --ignore=tests/test_ui_ai_explain.py --ignore=tests/test_ui_ai_static.py --ignore=tests/test_ui_health.py --ignore=tests/test_ui_chart.py --ignore=tests/test_ui_arch.py --ignore=tests/test_ui_theme.py --ignore=tests/test_ui_nav.py --ignore=tests/test_ui_contract.py --ignore=tests/test_ui_reader.py --ignore=tests/test_ui_guide.py -rs
      - run: coverage report -m --fail-under=80

  ui:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,treesitter]'
      - run: playwright install --with-deps chromium
      - name: Run the browser test (a skip counts as a failure)
        run: |
          pytest tests/test_ui.py tests/test_ui_ai.py tests/test_ui_ai_explain.py tests/test_ui_ai_static.py tests/test_ui_health.py tests/test_ui_chart.py tests/test_ui_arch.py tests/test_ui_theme.py tests/test_ui_nav.py tests/test_ui_contract.py tests/test_ui_reader.py tests/test_ui_guide.py -q -rs | tee out.txt
          ! grep -q skipped out.txt

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/code-explainer analyze tests/fixtures/pyapp -o /tmp/report.html
          grep -q "Code Explainer" /tmp/report.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-explainer"
version = "0.1.0"
description = "Turn any code repository into an interactive map you can actually navigate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
treesitter = [
  "tree-sitter>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]
dev = ["pytest>=7", "playwright>=1.40"]

[project.scripts]
code-explainer = "code_explainer.cli:main"

[tool.setuptools.packages.find]
include = ["code_explainer*"]

[tool.setuptools.package-data]
code_explainer = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

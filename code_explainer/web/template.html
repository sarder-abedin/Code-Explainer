<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Code Explainer</title>
<style>{{STYLE}}</style>
</head>
<body>
<header>
  <div class="brand" id="brand"></div>
  <nav id="tabs">
    <button data-tab="story">Story</button>
    <button data-tab="changes" hidden>Changes</button>
    <button data-tab="map">Map</button>
    <button data-tab="overview">Overview</button>
    <button data-tab="flow">Flow</button>
    <button data-tab="treemap">Treemap</button>
    <button data-tab="graph">Dependencies</button>
    <button data-tab="health">Health</button>
    <button data-tab="ai">AI</button>
    <button data-tab="words">Words</button>
  </nav>
  <label class="lvl">Explain
    <select id="level" aria-label="Explanation level">
      <option value="kid">Beginner-friendly</option>
      <option value="plain">Plain English</option>
      <option value="tech">Technical</option>
    </select>
  </label>
  <span id="live" class="live" hidden></span>
  <div class="search">
    <input id="search" type="search" placeholder="Search files and symbols  ( / )" autocomplete="off" spellcheck="false">
    <div id="results" hidden></div>
  </div>
</header>
<div id="toast" role="status" hidden></div>
<main>
  <section id="view"></section>
  <aside id="detail" hidden></aside>
</main>
<script type="application/json" id="data">{{DATA}}</script>
<script type="application/json" id="serve">{{SERVE}}</script>
<script>{{SCRIPT}}</script>
</body>
</html>
